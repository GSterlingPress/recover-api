name: RECOVER CI
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with: {node-version: 20}
      - run: npm test
  live:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: test
    runs-on: ubuntu-latest
    steps:
      - name: Wait for Railway deployment
        run: |
          for i in {1..60}; do
            BODY=$(curl -fsS --max-time 10 https://recover-api-production-bbba.up.railway.app/version || true)
            echo "$BODY"
            if echo "$BODY" | grep -q '"version":"0.1.2"'; then exit 0; fi
            sleep 10
          done
          exit 1
      - name: Verify safe demo exclusion
        run: |
          BODY=$(curl -fsS https://recover-api-production-bbba.up.railway.app/demo)
          echo "$BODY"
          echo "$BODY" | grep -q '"demo":true'
          echo "$BODY" | grep -q '"recorded":false'
      - name: Verify persistence sentinel and stranger safety
        run: |
          BODY=$(curl -fsS -H 'X-Recover-Internal: 1' https://recover-api-production-bbba.up.railway.app/_internal/persistence)
          echo "$BODY"
          echo "$BODY" | grep -q '"persistent":true'
          echo "$BODY" | grep -q '"strangerCount":0'
